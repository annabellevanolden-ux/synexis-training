<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synexis Partner Onboarding</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

  :root {
    --navy: #0a1628;
    --navy-mid: #112240;
    --accent: #00a8e8;
    --white: #ffffff;
    --gray-mid: #c8d0dc;
    --gray-text: #6b7a94;
    --green: #22c55e;
    --red: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Poppins', sans-serif;
    background: var(--navy);
    color: var(--white);
    min-height: 100vh;
  }

  /* PASSWORD SCREEN */
  #password-screen {
    position: fixed;
    inset: 0;
    background: var(--navy);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 24px;
  }

  #password-screen .lock-card {
    background: var(--navy-mid);
    border: 1px solid rgba(0,168,232,0.2);
    border-radius: 20px;
    padding: 48px 40px;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  #password-screen .lock-icon { font-size: 40px; margin-bottom: 20px; }
  #password-screen h2 { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
  #password-screen p { color: var(--gray-text); font-size: 13px; margin-bottom: 28px; line-height: 1.6; }
  #password-screen .pw-logo { margin-bottom: 28px; }
  #password-screen .pw-logo img { height: 30px; width: auto; }

  #pw-input {
    width: 100%;
    padding: 13px 16px;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: var(--white);
    font-size: 15px;
    font-family: 'Poppins', sans-serif;
    text-align: center;
    letter-spacing: 3px;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }

  #pw-input:focus { outline: none; border-color: var(--accent); }
  #pw-input.error { border-color: var(--red); animation: shake 0.3s ease; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  #pw-error { font-size: 12px; color: #fca5a5; margin-bottom: 12px; min-height: 18px; }

  /* HEADER */
  header {
    background: var(--navy);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 0 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo img { height: 34px; width: auto; display: block; }
  .progress-header {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    font-weight: 500;
    color: var(--gray-mid);
  }
  .progress-bar-wrap {
    width: 160px; height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.5s ease;
    width: 0%;
  }

  /* ... All CSS unchanged ... */
</style>
</head>
<body>
  <!-- PASSWORD SCREEN ... All HTML unchanged ... -->

  <script>
    const answers = {
      'm1q1':'B','m1q2':'C','m1q3':'B','m1q4':'C',
      'm2q1':'B','m2q2':'C',
      'm3q1':'B','m3q2':'C','m3q3':'C','m3q4':'C',
      'm4q1':'B','m4q2':'B',
      'm5q1':'B','m5q2':'C',
      'm6q1':'C','m6q2':'B'
    };

    const moduleState = {
      1: 'active', 2: 'locked', 3: 'locked', 4: 'locked', 5: 'locked', 6: 'locked'
    };

    // ... other code ...

    function updateProgress() {
      let completed = 0;
      // Only count modules 1 to 6 regardless of what is in moduleState
      for (let i = 1; i <= 6; i++) {
        if (moduleState[i] === 'completed') completed++;
      }
      // Cap the progress so it never exceeds 6
      completed = Math.min(completed, 6);
      document.getElementById('progress-text').textContent = `${completed} of 6 complete`;
      document.getElementById('progress-fill').style.width = (completed / 6 * 100) + '%';
    }

    // ... rest of your code ...
  </script>

</html>
